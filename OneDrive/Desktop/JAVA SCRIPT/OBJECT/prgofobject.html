    <!-- METHOD SHORTHAND  -->
     <!DOCTYPE html>
     <html lang="en">
     <head>
        <title>METHOD SHORTHAND</title>
     </head>
     <body>
        <SCRIPT>
            let product={
            company:'mango',
            iteamname:'cotton striped t-shirt',
            displayprice:function(){// is ke jagha ma nich short mai bhe likh sakta hmm is called method shorthand..
                return`${this.price.tofixed(2)}`;
            }
        };
        // is same as
            let product1={
            company:'mango',
            iteamname:'cotton striped t-shirt',
            displayprice(){
                return`${this.price.tofixed(2)}`;
        }
        };
        </SCRIPT>
     </body>
     </html>
