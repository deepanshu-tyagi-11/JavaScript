       <!-- FOR EACH LOOP...

 1.) a method for[array iteration] often preffered for redablity.//ISHA PADHNA ASHAN HAI AUR ARRAY ITERATION KA LIA USE KRTA HAI.

 2.) paramaters: one fot iteam optional second for index.

 3.) using return is similiar to continue in traditional loops.// thik hai return kraga to  continue ke traha kam kraga return.

 4.)not straightfordword to break out of a foreach loop.

 5.)when you need to perform an action on each array element and don't need to break early. // TO HUM FOREACH LOOP KA USE KRAGA-->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>FOR EACH LOOP</title>
</head>
<body>
<script>
    let arr=[1,2,3,4,5,6];
    for(let i=0;i<arr.length;i++){
     console.log(arr[i]);   
    }

    arr.foreach((num)=> console.log(num));
    // jha bhe hum array iteration use kr rahya hai hum  yaha for loop use kr sakta hai.
    // haimna arr.foreachloop ka ander ek function pass kra jiska ander num hai.
    // foreach mai jo hum return likta hai vo continue ke traha kam krta hai. 
    
    
</script>
</body>
</html>
