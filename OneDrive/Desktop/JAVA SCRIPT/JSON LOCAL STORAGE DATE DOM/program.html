<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <script>
      let product1={
          size:'s',
          name:'jeans',
          fit:'slim fit',  
          'delivery-time':'same day delivery',
        }; 
        localStorage.setItem('product1', product1); // profduct1 likha se isa kuch smj nhi ata to ya output mai ( object,object )de deta hai
        localStorage.setItem('product1', JSON.stringify(product1)); // yai krna se hamari object ke sari value store ho jaygi
        console.log(localStorage.getItem('product1')); // asha krna se consolr pai bhe (objetc,object) show hoga;
        let product2 = JSON.parse(localStorage.getItem('product1'));
        console.log(product2);

        localStorage.removeItem('size'); // kuch bhe hama remove krna ho to asha kr sakta hai..
        localStorage.clear();// yadi storage ka ander hama kuch bhe delete krna hoo to hum asha kr dega ..
  </script>
</body>
</html>
