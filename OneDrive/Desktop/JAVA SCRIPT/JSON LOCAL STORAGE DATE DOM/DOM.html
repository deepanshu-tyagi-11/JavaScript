<!-- 
                [DOM AND ELEMEMT METHOD] 
                1.) getelemetbyid()=> ya picha dkh lia
                2.)querselector()=> ya picha dkh lia
                3.) classlist: add(). remove()=> ya picha dkh lia
                4.) createlement()=>is se hum ek element bna sakta hai 
                5.) appendchild()=>kis exixting ka ander yadi muja kuch add krna hoo
                6.)removechild()
                7.)replacechild()--> relace se button ko replace kr sakta hai
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <title>dom</title>
 </head>
 <body>
    <!-- <button class="my-button" >button</button> -->
    <!-- <div class="my_div">this is the div</div> -->

    <script>
    let button =document.createElement('sheer');//yadi mai ya line likh ka console ma [button] type krta hmm too console hama bta deta hai ke ek button hai sheer nam ka..
    button.innertext='click_me';// .jo haimna button bnaya hai hum isma innertext ke madad se kuch text bhe  add kr sakta hmm.
    document.querySelector(".my_div").appendChild(button);//yadi mai ksi purana ka ander kuch add krna chata hmm to asha kr sakta hmm mtlb child add krna chata hmm..
    document.querySelector(".my_div").removeChild(button);// remove se jo haimna button bnaya thya issa hum button ko remove bhe kr sakta hai.
</script>
 </body>
 </html>
